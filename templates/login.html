{% extends "base.html" %}

{% block title %}Entrar — Moventra{% endblock %}

{% block content %}
<section class="form-container">
    <h1>Entrar no Moventra</h1>
    <p>Acesse sua conta para gerenciar seus alunos e sua agenda.</p>

    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
            >
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
            >
        </div>

        <button type="submit" class="btn primary">Entrar</button>
    </form>

    <p>
        Ainda não tem conta?
        <a href="{{ url_for('signup') }}">Cadastre-se</a>
    </p>
</section>
{% endblock %}
