{% extends 'base.html' %}{% block title %}Cobranças — Moventra{% endblock %}{% block content %}
<section class="pagehead"><div><span class="eyebrow">CONTROLE FINANCEIRO</span><h1>Cobranças</h1><p>Registre mensalidades e acompanhe os pagamentos.</p></div><a class="btn outline" href="/app">Voltar ao painel</a></section>
<section class="manage-card"><h2>Nova cobrança</h2><form id="payment-form"><div class="formgrid"><div class="field"><label for="student_id">Aluno</label><select id="student_id" name="student_id" required><option value="">Carregando alunos…</option></select></div><div class="field"><label for="amount">Valor (R$)</label><input id="amount" name="amount" type="number" min="0.01" step="0.01" required placeholder="150,00"></div><div class="field"><label for="due_date">Vencimento</label><input id="due_date" name="due_date" type="date" required></div><div class="field"><label for="description">Descrição</label><input id="description" name="description" maxlength="255" value="Mensalidade"></div></div><div class="toolbar"><button class="btn primary" type="submit">Registrar cobrança</button></div></form><div id="payment-message" aria-live="polite"></div></section>
<section class="manage-card"><h2>Histórico de cobranças</h2><div id="payment-list" class="tablewrap">Carregando cobranças…</div></section>
<script>
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function loadStudents(){const s=document.getElementById('student_id');try{const r=await fetch('/api/students');const data=await r.json();s.innerHTML='<option value="">Selecione um aluno</option>'+data.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.email)}</option>`).join('');}catch(e){s.innerHTML='<option value="">Erro ao carregar alunos</option>';}}
async function loadPayments(){const box=document.getElementById('payment-list');try{const r=await fetch('/api/payments');const data=await r.json();if(!r.ok)throw new Error(data.error||'Falha ao carregar cobranças.');if(!data.length){box.innerHTML='<p class="muted">Nenhuma cobrança registrada ainda.</p>';return;}box.innerHTML='<table><thead><tr><th>Vencimento</th><th>Aluno</th><th>Descrição</th><th>Valor</th><th>Status</th><th>Link</th></tr></thead><tbody>'+data.map(p=>`<tr><td>${esc(p.due_date)}</td><td>${esc(p.student_name)}</td><td>${esc(p.description)}</td><td>R$ ${(Number(p.amount_cents)/100).toFixed(2).replace('.',',')}</td><td>${esc(p.status)}</td><td>${p.checkout_url?`<a target="_blank" rel="noopener" href="${esc(p.checkout_url)}">Pagar</a>`:'—'}</td></tr>`).join('')+'</tbody></table>';}catch(e){box.innerHTML='<p class="notice error">'+esc(e.message)+'</p>';}}
document.getElementById('payment-form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const msg=document.getElementById('payment-message');msg.innerHTML='Salvando cobrança…';try{const r=await fetch('/api/payments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:f.get('student_id'),amount:f.get('amount'),due_date:f.get('due_date'),description:f.get('description')})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha ao registrar cobrança.');let extra=d.checkout_url?` <a target="_blank" rel="noopener" href="${esc(d.checkout_url)}">Abrir link de pagamento</a>`:'';if(d.whatsapp_url)extra+=` · <a target="_blank" rel="noopener" href="${esc(d.whatsapp_url)}">Enviar lembrete no WhatsApp</a>`;msg.innerHTML='<p class="notice success">Cobrança registrada.'+extra+'</p>';e.target.reset();loadPayments();}catch(err){msg.innerHTML='<p class="notice error">'+esc(err.message)+'</p>';}});loadStudents();loadPayments();
</script>{% endblock %}
