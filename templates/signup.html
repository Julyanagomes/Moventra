{% extends "base.html" %}

{% block title %}Criar conta — Moventra{% endblock %}

{% block content %}
<section class="form-container">
    <h1>Crie sua conta</h1>
    <p>Comece a organizar seus alunos e sua agenda com o Moventra.</p>

    <form method="POST" action="{{ url_for('signup') }}">
        <div class="form-group">
            <label for="name">Seu nome</label>
            <input
                type="text"
                id="name"
                name="name"
                required
                autocomplete="name"
            >
        </div>

        <div class="form-group">
            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
            >
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                minlength="10"
                autocomplete="new-password"
            >
        </div>

        <button type="submit" class="btn primary">Criar conta</button>
    </form>

    <p>
        Já tem uma conta?
        <a href="{{ url_for('login') }}">Entrar</a>
    </p>
</section>
{% endblock %}
